<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Invention Map · __MUSEUM__</title>
  <meta name="description" content="The interactive invention map of __MUSEUM__, opened as a Telegram Mini App.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <!-- Telegram's own Mini App bridge (window.Telegram.WebApp). Outside Telegram it does nothing. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Theme before paint: Telegram's colour scheme inside the app, the system setting elsewhere.
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      var t = tg && tg.initData ? tg.colorScheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
    })();
  </script>
</head>
<body class="tg">
  <main class="tg__main">
    <header class="tg__head">
      <p class="eyebrow">__MUSEUM__ · Invention map</p>
      <h1>Where the ideas came from</h1>
      <p class="tg__lead">Tap a country on the map or in the list. Pick a second one to compare them by century. Tap an exhibit to open its card in the chat.</p>
    </header>
    <div class="atlas__grid" id="map"></div>
  </main>
  <noscript><p class="noscript">The map is drawn with JavaScript. Please enable it, or use the map in the bot.</p></noscript>
  <script type="module" src="/src/miniapp/main.ts"></script>
</body>
</html>
