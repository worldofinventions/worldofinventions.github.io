# Builds the showcase sites (site/ and ru/site/ under /ru/) and publishes them on GitHub Pages on every push to main.
name: Site on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            ru/site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://worldofinventions.github.io
      # The Russian-language museum of the same ecosystem: built from ru/site and
      # published under /ru/ (https://worldofinventions.github.io/ru/).
      - run: npm ci
        working-directory: ru/site
      - run: npm run build
        working-directory: ru/site
        env:
          RU_SITE_URL: https://worldofinventions.github.io/ru
      - run: cp -r ru/site/dist site/dist/ru
        working-directory: .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
