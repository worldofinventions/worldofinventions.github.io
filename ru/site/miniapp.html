<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Карта изобретений · __MUSEUM__</title>
  <meta name="description" content="Интерактивная карта изобретений: __MUSEUM__, Telegram Mini App.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <!-- Telegram's own Mini App bridge (window.Telegram.WebApp). Outside Telegram it does nothing. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Theme before paint: Telegram's colour scheme inside the app, the system setting elsewhere.
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      var t = tg && tg.initData ? tg.colorScheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
    })();
  </script>
</head>
<body class="tg">
  <main class="tg__main">
    <header class="tg__head">
      <p class="eyebrow">__MUSEUM__ · Карта изобретений</p>
      <h1>Где появились изобретения</h1>
      <p class="tg__lead">Нажмите на страну на карте или в списке. Выберите вторую, чтобы сравнить их по векам. Нажмите на экспонат, чтобы открыть его карточку в чате.</p>
    </header>
    <div class="atlas__grid" id="map"></div>
  </main>
  <noscript><p class="noscript">Карта рисуется с помощью JavaScript. Включите его или пользуйтесь картой в боте.</p></noscript>
  <script type="module" src="/src/miniapp/main.ts"></script>
</body>
</html>
