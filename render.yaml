# Render Blueprint: the Telegram bot + Mini App (Python web service, webhook).
# The showcase site and the map mini app are published by GitHub Pages
# (.github/workflows/pages.yml).
services:
  - type: web
    name: world-of-inventions-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python miniapp/server.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      # Optional: "off" turns the Mini App map off (text map only).
      - key: WEBAPP_URL
        sync: false

